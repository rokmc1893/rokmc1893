<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="intro-title intro-desc">
  <title id="intro-title">AI와 함께 서비스를 만들며, AX 엔지니어로 성장하고 있습니다.</title>
  <desc id="intro-desc">AI를 활용한 프로젝트 경험과 AX 엔지니어라는 목표를 소개하는 카드. 어두운 카본 배경과 빨간 포인트로 F1 배너와 연결됩니다.</desc>
  <defs>
    <linearGradient id="intro-bg" x2="1" y2="1"><stop stop-color="#171c26"/><stop offset="1" stop-color="#080b10"/></linearGradient>
    <pattern id="intro-carbon" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 16 16 0M-8 8 8-8M8 24 24 8" stroke="#fff" stroke-opacity=".025" stroke-width="4"/></pattern>
    <clipPath id="intro-clip"><rect x=".5" y=".5" width="1199" height="189" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#intro-clip)">
    <rect width="1200" height="190" fill="url(#intro-bg)"/>
    <rect width="1200" height="190" fill="url(#intro-carbon)"/>
    <rect width="6" height="190" fill="#ff3535"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="189" rx="12" fill="none" stroke="#2a303b"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif">
    <text x="44" y="36" fill="#ff6b68" font-size="14" font-weight="600" letter-spacing="1">목표 · AX 엔지니어</text>
    <text x="44" y="84" fill="#E8EDF5" font-size="30" font-weight="700">AI와 함께 서비스를 만들며,</text>
    <text x="44" y="126" fill="#E8EDF5" font-size="30" font-weight="700">AX 엔지니어로 성장하고 있습니다.</text>
    <text x="44" y="163" fill="#a9b2c1" font-size="17">계약서 분석 · 정책 검토 · 웹·모바일 서비스 프로젝트 경험</text>
  </g>
  <g transform="translate(1038 57)" fill="none" stroke="#ff3535" stroke-width="3" opacity=".5">
    <path d="m0 0 30 30-30 30m35-60 30 30-30 30m35-60 30 30-30 30"/>
  </g>
</svg>
