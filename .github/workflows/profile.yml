name: 프로필 기여 기록 갱신

on:
  schedule:
    - cron: "17 18 * * *" # 매일 03:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile.yml"
      - "scripts/update-cards.py"

permissions:
  contents: write

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    name: 잔디와 통계 이미지 생성
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 실제 기여 기록으로 잔디 애니메이션 생성
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            profile/snake.svg?palette=github-light&color_snake=%230969da
            profile/snake-dark.svg?palette=github-dark&color_snake=%232dd4bf

      - name: 실제 기여 기록으로 3D 잔디 생성
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: 공개 활동 통계 카드 갱신
        continue-on-error: true # 외부 통계 서비스 장애 시 기존 정상 이미지를 유지한다.
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/update-cards.py

      - name: 생성 이미지 검증
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = [
              'profile/snake.svg', 'profile/snake-dark.svg',
              'profile/stats.svg', 'profile/stats-dark.svg',
              'profile/top-langs.svg', 'profile/top-langs-dark.svg',
              'profile-3d-contrib/profile-green.svg',
              'profile-3d-contrib/profile-night-green.svg',
          ]
          for name in paths:
              path = Path(name)
              if not path.is_file() or path.stat().st_size < 100:
                  raise SystemExit(f'이미지가 없거나 비어 있다: {name}')
              root = ET.parse(path).getroot()
              if root.tag != '{http://www.w3.org/2000/svg}svg':
                  raise SystemExit(f'SVG 파일이 아니다: {name}')
          PY

      - name: 변경된 기여 이미지 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/snake*.svg profile/stats*.svg profile/top-langs*.svg profile-3d-contrib/profile-green.svg profile-3d-contrib/profile-night-green.svg
          if git diff --cached --quiet; then
            echo "기여 이미지가 최신 상태다."
            exit 0
          fi
          git commit -m "chore: 프로필 기여 기록과 통계 이미지 갱신"
          git pull --rebase origin main
          git push origin HEAD:main
